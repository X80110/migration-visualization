<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Chord Diagram - Migrant Population Over Time (v5 - Refined Scaling)</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* CSS remains largely the same */
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; flex-direction: column; min-height: 100vh; margin: 0; background-color: #f4f4f4; }
        .chart-container { text-align: center; }
        svg { background-color: white; display: block; margin: 10px auto; }
        .group path { stroke: #fff; stroke-width: 0.5px; }
        .group-label { font-size: 11px; fill: #333; pointer-events: none; }
        .chord path { stroke: #fff; stroke-width: 0.5px; fill-opacity: 0.7; transition: opacity 0.3s ease; }
        .chord path:hover { fill-opacity: 0.9; }
        h1 { margin-top: 20px; font-size: 1.5em; color: #333; }
        p { font-size: 0.8em; color: #666; margin-bottom: 10px; }
        .controls { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 15px; width: 90%; max-width: 750px; }
        .control-group { margin: 5px 15px; text-align: center; }
        .control-group label { font-weight: bold; margin-right: 5px; display: block; margin-bottom: 3px; }
        .control-group input[type="range"] { width: 200px; vertical-align: middle; }
        .control-group .value-display { display: inline-block; min-width: 40px; font-weight: bold; color: #007bff; margin-left: 5px; }
        .control-group.checkbox-group label { display: inline-block; margin-bottom: 0; margin-left: 3px; font-weight: normal; }
        .control-group.checkbox-group input[type="checkbox"] { vertical-align: middle; }
    </style>
</head>
<body>
    <div class="chart-container">
        <h1>Migrant Population (Sample Data)</h1>
        <p>Data source concept from: unmigration.org</p>

        <div class="controls">
             <div class="control-group">
                 <label for="year-slider">Year:</label>
                 <input type="range" id="year-slider" name="year">
                 <span id="year-label" class="value-display"></span>
            </div>
             <div class="control-group checkbox-group">
                 <input type="checkbox" id="scale-toggle" name="scale-toggle">
                 <label for="scale-toggle">Use Max Flow for Arc Scale</label>
            </div>
        </div>

        <svg id="chord-diagram"></svg>
    </div>

    <script>
        // --- Configuration ---
        const width = 700;
        const height = 700;
        const outerRadius = Math.min(width, height) * 0.5 - 70;
        const innerRadius = outerRadius - 20;
        const transitionDuration = 750; // ms
        const epsilon = 1e-6; // Small number for float comparisons/division

        // --- Data ---
        const regions = ["North America","Sub-Saharan Africa","North Africa","Europe","East Europe & Central Asia","West Asia","South Asia","East Asia","South-East Asia","Oceania","Latin America & the Caribbean"];
        const numRegions = regions.length;

        // Placeholder Data - REPLACE WITH REAL DATA
        const migrationDataByYear = { /* ... Same data as before ... */
             "1990": [[10,2,1,5,1,2,3,4,2,1,15],[1,20,3,4,0,1,1,0,1,0,1],[0,5,5,10,0,8,1,0,0,0,1],[8,6,8,50,15,5,4,2,3,1,5],[1,1,1,12,30,3,2,1,1,0,1],[1,2,5,6,4,25,10,1,5,0,1],[2,1,1,5,1,15,40,2,10,1,1],[3,0,0,2,1,1,3,35,5,1,2],[2,1,0,3,1,6,8,6,30,2,1],[2,1,0,2,0,1,2,2,3,5,1],[18,1,1,6,1,1,1,1,1,0,20]],
             "2000": [[12,3,1,6,1,3,4,5,3,1,18],[1,22,4,5,1,1,1,0,1,0,1],[1,6,6,12,0,10,1,0,0,0,1],[9,7,9,55,18,6,5,3,4,1,6],[1,1,1,14,32,4,2,1,1,0,1],[1,3,6,7,5,28,12,1,6,0,1],[3,1,1,6,1,18,45,3,12,1,1],[4,1,0,3,1,1,4,38,6,1,3],[3,1,0,4,1,7,10,7,33,2,1],[2,1,0,3,1,1,2,3,4,6,1],[20,1,1,7,1,1,1,1,1,0,22]],
             "2010": [[14,4,2,7,2,4,5,6,4,2,22],[2,25,5,6,1,2,1,1,1,0,2],[1,7,7,14,1,12,2,0,1,0,1],[10,8,10,60,20,7,6,4,5,2,7],[2,1,1,16,35,5,3,1,1,0,1],[2,4,7,8,6,32,15,2,7,1,2],[4,2,1,7,2,22,50,4,15,1,2],[5,1,1,4,2,2,5,42,8,2,4],[4,2,1,5,2,9,12,9,36,3,2],[3,2,1,4,1,2,3,4,5,7,2],[24,2,1,8,1,1,1,2,1,1,25]],
             "2020": [[15,5,2,8,2,5,6,7,5,2,25],[2,28,6,7,1,2,2,1,2,1,2],[1,8,8,15,1,14,2,1,1,0,2],[11,9,11,65,22,8,7,5,6,2,8],[2,1,1,18,38,6,3,2,1,0,2],[2,5,8,9,7,35,18,2,8,1,2],[5,2,2,8,2,25,55,5,18,2,2],[6,1,1,5,2,2,6,45,10,2,5],[5,2,1,6,2,10,15,10,40,3,2],[4,2,1,5,1,2,4,5,6,8,2],[28,2,1,9,1,2,1,2,1,1,28]]
        };
        const availableYears = Object.keys(migrationDataByYear).sort();

        // --- Chord Layout Generators ---
        const unsortedLayoutGen = d3.chord().padAngle(0.05).sortSubgroups(null).sortChords(null);
        const yearChordLayoutGen = d3.chord().padAngle(0.05).sortSubgroups(d3.descending).sortChords(d3.descending);

        // --- Calculate Max Flows and Cache Unsorted Group Data ---
        const maxFlowsPerRegion = new Array(numRegions).fill(0);
        const regionDataCache = {};

        availableYears.forEach(year => {
            const matrix = migrationDataByYear[year];
            const unsortedLayout = unsortedLayoutGen(matrix);
            regionDataCache[year] = unsortedLayout.groups.reduce((acc, g) => {
                acc[g.index] = { value: g.value, startAngle: g.startAngle, endAngle: g.endAngle };
                if (g.value > maxFlowsPerRegion[g.index]) {
                    maxFlowsPerRegion[g.index] = g.value;
                }
                return acc;
            }, {});
        });

        // Create dummy matrix for max flow scale
        const baseDummyMatrix = Array.from({ length: numRegions }, (_, i) =>
            Array.from({ length: numRegions }, (_, j) => (i === j ? (maxFlowsPerRegion[i] > epsilon ? maxFlowsPerRegion[i] : epsilon) : 0))
        );

        // Calculate the base layout once (using unsorted generator)
        const baseLayout = unsortedLayoutGen(baseDummyMatrix);
        const baseGroupsByIndex = baseLayout.groups.reduce((acc, g) => { acc[g.index] = g; return acc; }, {});
        console.log(baseGroupsByIndex)

        // --- SVG Setup ---
        const svg = d3.select("#chord-diagram").attr("width", width).attr("height", height).attr("viewBox", [-width/2, -height/2, width, height]).attr("style", "max-width: 100%; height: auto;");
        const color = d3.scaleOrdinal(d3.schemeCategory10).domain(d3.range(numRegions));
        const arcGen = d3.arc().innerRadius(innerRadius).outerRadius(outerRadius);
        const ribbonGen = d3.ribbon().radius(innerRadius);
        const groupG = svg.append("g").attr("class", "group");
        const chordG = svg.append("g").attr("class", "chord");

        // --- UI Elements ---
        const slider = d3.select("#year-slider").attr("min", 0).attr("max", availableYears.length - 1).attr("step", 1).attr("value", 0).on("input", updateVisualization);
        const yearLabel = d3.select("#year-label");
        const scaleToggle = d3.select("#scale-toggle").on("change", updateVisualization);

        // --- Helper: Function to manually scale chord endpoints (Refined Attempt #4 Logic) ---
        function scaleChordLayout(currentYearLayoutChords, // Chords from SORTED layout
                                   currentYearGroupsByIndex, // Groups from UNSORTED layout (cache)
                                   baseLayoutGroupsByIndex,
                                   maxFlows)
        {
            const scaledChords = [];
            const groupScalingInfo = {};

            Object.keys(baseLayoutGroupsByIndex).forEach(indexStr => {
                const i = parseInt(indexStr);
                const baseGroup = baseLayoutGroupsByIndex[i];
                const currentGroup = currentYearGroupsByIndex[i];

                if (!currentGroup || !baseGroup) {
                    groupScalingInfo[i] = { isValid: false }; return;
                }

                const maxFlow = maxFlows[i];
                const currentFlow = currentGroup.value;
                const isAtMax = Math.abs(currentFlow - maxFlow) < epsilon;
                const scaleFactor = maxFlow > epsilon ? currentFlow / maxFlow : 0;
                const baseAngleWidth = baseGroup.endAngle - baseGroup.startAngle;
                const safeBaseAngleWidth = baseAngleWidth > epsilon ? baseAngleWidth : epsilon;
                const scaledAngleWidth = safeBaseAngleWidth * scaleFactor;
                const currentAngleWidth = currentGroup.endAngle - currentGroup.startAngle;
                const safeCurrentAngleWidth = currentAngleWidth > epsilon ? currentAngleWidth : epsilon;

                groupScalingInfo[i] = {
                    isValid: true, isAtMax: isAtMax, scaleFactor: scaleFactor,
                    baseStartAngle: baseGroup.startAngle, baseAngleWidth: safeBaseAngleWidth,
                    scaledAngleWidth: scaledAngleWidth, currentStartAngle: currentGroup.startAngle,
                    currentAngleWidth: safeCurrentAngleWidth
                };
            });

            currentYearLayoutChords.forEach(chord => {
                const sIndex = chord.source.index;
                const tIndex = chord.target.index;
                const sInfo = groupScalingInfo[sIndex];
                const tInfo = groupScalingInfo[tIndex];

                if (!sInfo?.isValid || !tInfo?.isValid) return;

                let scaledSourceStartAngle, scaledSourceEndAngle;
                const sourcePropStart = (chord.source.startAngle - sInfo.currentStartAngle) / sInfo.currentAngleWidth;
                const sourcePropWidth = (chord.source.endAngle - chord.source.startAngle) / sInfo.currentAngleWidth;

                if (sInfo.isAtMax) {
                    scaledSourceStartAngle = sInfo.baseStartAngle + sourcePropStart * sInfo.baseAngleWidth;
                    scaledSourceEndAngle = scaledSourceStartAngle + sourcePropWidth * sInfo.baseAngleWidth;
                } else if (sInfo.scaleFactor > epsilon) {
                    scaledSourceStartAngle = sInfo.baseStartAngle + sourcePropStart * sInfo.scaledAngleWidth;
                    scaledSourceEndAngle = scaledSourceStartAngle + sourcePropWidth * sInfo.scaledAngleWidth;
                } else {
                    scaledSourceStartAngle = sInfo.baseStartAngle;
                    scaledSourceEndAngle = sInfo.baseStartAngle;
                }

                 let scaledTargetStartAngle, scaledTargetEndAngle;
                 const targetPropStart = (chord.target.startAngle - tInfo.currentStartAngle) / tInfo.currentAngleWidth;
                 const targetPropWidth = (chord.target.endAngle - chord.target.startAngle) / tInfo.currentAngleWidth;

                if (tInfo.isAtMax) {
                    scaledTargetStartAngle = tInfo.baseStartAngle + targetPropStart * tInfo.baseAngleWidth;
                    scaledTargetEndAngle = scaledTargetStartAngle + targetPropWidth * tInfo.baseAngleWidth;
                } else if (tInfo.scaleFactor > epsilon) {
                    scaledTargetStartAngle = tInfo.baseStartAngle + targetPropStart * tInfo.scaledAngleWidth;
                    scaledTargetEndAngle = scaledTargetStartAngle + targetPropWidth * tInfo.scaledAngleWidth;
                } else {
                    scaledTargetStartAngle = tInfo.baseStartAngle;
                    scaledTargetEndAngle = tInfo.baseStartAngle;
                }

                 if ([scaledSourceStartAngle, scaledSourceEndAngle, scaledTargetStartAngle, scaledTargetEndAngle].some(isNaN)) {
                    console.warn("NaN angle detected, skipping chord:", chord, " Scaling Info S:", sInfo, " T:", tInfo);
                    return;
                 }

                 scaledChords.push({
                     source: { ...chord.source, startAngle: scaledSourceStartAngle, endAngle: scaledSourceEndAngle },
                     target: { ...chord.target, startAngle: scaledTargetStartAngle, endAngle: scaledTargetEndAngle }
                 });
            });
            return scaledChords;
        }


        // --- Update Function ---
        function updateVisualization() {
            const selectedYearIndex = +slider.property("value");
            const selectedYear = availableYears[selectedYearIndex];
            const useMaxScale = scaleToggle.property("checked");

            yearLabel.text(selectedYear);
            const currentYearMatrix = migrationDataByYear[selectedYear];
            if (!currentYearMatrix) return;

            // Calculate the SORTED layout for the current year - chord shapes/values come from here
            const currentYearSortedLayout = yearChordLayoutGen(currentYearMatrix);

            // Determine data for arcs and chords based on checkbox
            let arcDataGroups;
            let chordDataForBinding; // Stores either scaled chord array or full layout object

            if (useMaxScale) { // Checkbox IS CHECKED
                arcDataGroups = baseLayout.groups; // Arcs use max flow scale (unsorted base)
                const currentYearUnsortedGroups = regionDataCache[selectedYear];
                // Manually scale the current year's chords (from sorted layout) to fit the base arcs
                chordDataForBinding = scaleChordLayout(
                    currentYearSortedLayout, // Pass the chords array from sorted layout
                    currentYearUnsortedGroups, // Reference values/angles from unsorted layout cache
                    baseGroupsByIndex,
                    maxFlowsPerRegion
                ); // This results in an ARRAY of scaled chords

            } else { // Checkbox IS NOT CHECKED
                // Use the sorted layout for BOTH arcs and chords
                arcDataGroups = currentYearSortedLayout.groups; // Arcs directly from current year layout
                chordDataForBinding = currentYearSortedLayout; // Use the full LAYOUT OBJECT
            }

            // --- Update Groups (Arcs and Labels) ---
            const groups = groupG.selectAll("g").data(arcDataGroups, d => d.index);
            const groupEnter = groups.enter().append("g").attr("opacity", 0);
            groupEnter.append("path").attr("fill", d => color(d.index)).attr("stroke", d => d3.rgb(color(d.index)).darker());
            groupEnter.append("text").attr("class", "group-label").attr("dy", "0.35em").text(d => regions[d.index]);

            const groupUpdate = groupEnter.merge(groups);
            groupUpdate.transition("fade").duration(transitionDuration / 4).attr("opacity", 1);

            groupUpdate.select("path")
                .transition("shape").duration(transitionDuration)
                .attrTween("d", function(d) {
                      const i = d3.interpolate(this._currentArc || {startAngle: d.startAngle, endAngle: d.startAngle, index: d.index}, d);
                      this._currentArc = i(1);
                      return t => arcGen(i(t));
                  });
            groupUpdate.select("text")
                .transition("position").duration(transitionDuration)
                .attrTween("transform", function(d) {
                    const currentAngle = this._currentAngle !== undefined ? this._currentAngle : d.startAngle;
                    const targetAngle = (d.startAngle + d.endAngle) / 2;
                    if (isNaN(currentAngle) || isNaN(targetAngle)) return t => `rotate(0) translate(${outerRadius + 5})`;
                    const iAngle = d3.interpolate(currentAngle, targetAngle);
                    this._currentAngle = targetAngle;
                    return t => {
                         const angle = iAngle(t);
                         if (isNaN(angle)) return `rotate(0) translate(${outerRadius + 5})`;
                         return `rotate(${(angle * 180 / Math.PI - 90)}) translate(${outerRadius + 5}) ${angle > Math.PI ? "rotate(180)" : ""}`;
                    };
                })
                 .attrTween("text-anchor", function(d){
                      const finalAngle = (d.startAngle + d.endAngle) / 2;
                      if (isNaN(finalAngle)) return t => "start";
                      const finalAnchor = finalAngle > Math.PI ? "end" : "start";
                      return t => finalAnchor;
                 });
            groups.exit().transition("fade_exit_group").duration(transitionDuration / 2).attr("opacity", 0).remove();


            // --- Update Chords ---
            // Determine the correct array of chords to draw
            const chordsToDraw = Array.isArray(chordDataForBinding) ? chordDataForBinding : chordDataForBinding.chords;
            const chords = chordG.selectAll("path").data(chordsToDraw, d => `${d.source.index}-${d.target.index}`);

            const chordEnter = chords.enter().append("path")
                 .attr("fill", d => color(d.source.index))
                 .attr("stroke", d => d3.rgb(color(d.source.index)).darker())
                 .style("mix-blend-mode", "multiply")
                 .attr("opacity", 0);
            chordEnter.append("title");

            chordEnter.merge(chords)
                 .select("title")
                     .text(d => {
                        // Tooltip needs original values. Find the original chord data.
                        const originalChord = currentYearSortedLayout.find(c => c.source.index === d.source.index && c.target.index === d.target.index);
                        const sourceValue = originalChord ? originalChord.source.value : d.source.value || 0;
                        const targetValue = originalChord ? originalChord.target.value : d.target.value || 0;
                        return `${selectedYear}: ${regions[d.source.index]} → ${regions[d.target.index]}: ${sourceValue.toLocaleString()}M\n${selectedYear}: ${regions[d.target.index]} → ${regions[d.source.index]}: ${targetValue.toLocaleString()}M`;
                     });

            chordEnter.merge(chords)
                 .transition("shape").duration(transitionDuration)
                 .attrTween("d", function(d) {
                      const isValidNumber = (n) => typeof n === 'number' && !isNaN(n);
                      const isValidEndpoint = (e) => e && isValidNumber(e.startAngle) && isValidNumber(e.endAngle);
                      if (!isValidEndpoint(d.source) || !isValidEndpoint(d.target)) {
                           console.warn("Invalid chord data pre-tween:", d); return t => "";
                      }
                      const startState = this._currentRibbon || {
                           source: {startAngle: d.source.startAngle, endAngle: d.source.startAngle},
                           target: {startAngle: d.target.startAngle, endAngle: d.target.startAngle}
                      };
                      if (!isValidEndpoint(startState.source) || !isValidEndpoint(startState.target)) {
                            startState.source = {startAngle: d.source.startAngle, endAngle: d.source.startAngle};
                            startState.target = {startAngle: d.target.startAngle, endAngle: d.target.startAngle};
                      }
                      const i = d3.interpolate(startState, d);
                      this._currentRibbon = i(1);
                      // Safety check within tween function
                      return t => {
                        const interpolated = i(t);
                        if (!isValidEndpoint(interpolated.source) || !isValidEndpoint(interpolated.target)) {
                            console.warn("Invalid interpolated data:", interpolated);
                            return ""; // Prevent error in ribbonGen
                        }
                        return ribbonGen(interpolated);
                      };
                  })
                 .attr("opacity", 0.7);

            chordEnter.transition("fade").duration(transitionDuration / 2).delay(transitionDuration / 4)
                .attr("opacity", 0.7);

            chords.exit()
                .transition("fade_exit_chord").duration(transitionDuration / 2)
                .attr("opacity", 0)
                .remove();
        }

        // --- Initial Visualization ---
        updateVisualization();

    </script>
</body>
</html>
